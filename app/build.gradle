plugins { id 'com.android.application' }

android {
    namespace 'com.quint.kitchenquest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.quint.kitchenquest'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
