// ============ KITCHEN QUEST — OVERWORLD DEMO ============
// Prototype 3: cramped kitchen, moving NPCs (solid), playable dish pit.
const RES=2;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
ctx.scale(RES,RES);
function fit(){const s=Math.max(1,Math.min((window.innerWidth-24)/512,(window.innerHeight-24)/352));cv.style.width=(512*s)+'px';cv.style.height=(352*s)+'px';}
fit();
window.addEventListener('resize',fit);

const C={bg:'#0f0f23',panel:'#1a1a2e',line:'#2a2a4a',gold:'#ffd541',red:'#e76e55',grn:'#63c74d',blu:'#587ccc',wht:'#f4f4f4',gry:'#8b8ba7',org:'#fe9c4d',drk:'#111120'};
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.max(0,w|0),Math.max(0,h|0));}
function T(s,x,y,c,sz){ctx.fillStyle=c||C.wht;ctx.font=(sz||9)+'px monospace';ctx.textBaseline='top';ctx.fillText(s,x|0,y|0);}
function bar(x,y,w,h,pct,fg,bg){R(x,y,w,h,bg||C.line);R(x,y,w*Math.max(0,Math.min(1,pct)),h,fg);}

// ---- input ----
const down={},just={};
function pressKey(k){k=(''+k).toLowerCase();
  if(paused){paused=false;for(var pk in just)just[pk]=false;} // the waking input is swallowed
  if(!down[k])just[k]=true;down[k]=true;}
function releaseKey(k){down[(''+k).toLowerCase()]=false;}
function tapKey(k){pressKey(k);releaseKey(k);} // canvas taps: fire the just-pulse, never leave the key held
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  pressKey(k);
  if(k===' '||k.indexOf('arrow')===0)e.preventDefault();
});
window.addEventListener('keyup',function(e){releaseKey(e.key);});

// ---- touch controls: virtual keys drawn INTO the canvas ----
// DOM overlay buttons can get their taps swallowed by embedded viewers, so the
// d-pad and action buttons are rendered on the canvas and fed by canvas touch
// events - the exact same pressKey/releaseKey path as the keyboard.
var TOUCH=(typeof navigator!=='undefined')&&(('ontouchstart'in window)||navigator.maxTouchPoints>0);
var TBTN=[]; // virtual buttons in game-coordinate rects (512x352), shown on touch devices
function mkT(k,x,y,w,h,label){TBTN.push({k:k,x:x,y:y,w:w,h:h,label:label,on:false});}
if(TOUCH){
  // d-pad, lower-left - tucked below the kitchen map (map ends at y=174)
  mkT('arrowup',26,182,36,36,'▲');
  mkT('arrowleft',2,222,36,36,'◀');
  mkT('arrowright',54,222,36,36,'▶');
  mkT('arrowdown',26,262,36,36,'▼');
  // action cluster, lower-right - over the message box band, never over the stations
  mkT('d',330,182,48,40,'D');
  mkT('n',382,182,48,40,'N');
  mkT('r',330,226,48,40,'R');
  mkT('enter',382,226,124,40,'BACK'); // function button 1 of 2, opposite the d-pad: back out of a station
  mkT('s',330,270,48,62,'S');
  mkT(' ',382,270,124,62,'SPACE'); // function button 2 of 2, opposite the d-pad: work/confirm (hold for slow jobs)
  mkT('q',104,182,68,20,'QUIT (Q)'); // abandon the shift, back to the menu
}
function drawTouchUI(){ // drawn last so the virtual keys sit over the world and message box
  for(var i=0;i<TBTN.length;i++){var b=TBTN[i];
    R(b.x,b.y,b.w,b.h,b.on?'#ffd541':'rgba(26,26,46,0.72)');
    R(b.x,b.y,b.w,2,'#6a5a3a');R(b.x,b.y+b.h-2,b.w,2,'#6a5a3a');R(b.x,b.y,2,b.h,'#6a5a3a');R(b.x+b.w-2,b.y,2,b.h,'#6a5a3a');
    var fs=b.label.length>2?10:16;
    T(b.label,b.x+b.w/2-b.label.length*fs*0.3,b.y+b.h/2-fs/2,b.on?'#1a1a2e':'#ffd541',fs);
  }
}
function unlockAudio(){try{ // iOS/Android: audio must start inside a user gesture
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
}catch(err){}}
if(TOUCH&&cv.addEventListener){
  var tpos=function(t){var r=cv.getBoundingClientRect();return {x:(t.clientX-r.left)/r.width*512,y:(t.clientY-r.top)/r.height*352};};
  var hitBtn=function(p){for(var i=0;i<TBTN.length;i++){var b=TBTN[i];if(p.x>=b.x&&p.x<b.x+b.w&&p.y>=b.y&&p.y<b.y+b.h)return b;}return null;};
  var touchHeld=function(e){ // recompute every virtual key from ALL active touches (multi-touch + slide)
    e.preventDefault();
    var held={},i;
    for(i=0;i<e.touches.length;i++){var b=hitBtn(tpos(e.touches[i]));if(b)held[b.k]=true;}
    for(i=0;i<TBTN.length;i++){var v=TBTN[i];
      if(held[v.k]){if(!down[v.k])pressKey(v.k);v.on=true;}
      else{if(down[v.k]&&!(overlayTap&&v.k===' '))releaseKey(v.k);v.on=false;}
    }
  };
  cv.addEventListener('touchstart',function(e){
    unlockAudio();
    if(scene==='menu'){
      e.preventDefault();
      var p=tpos(e.changedTouches[0]);
      if(p.x>=402&&p.x<=508&&p.y>=126&&p.y<=142)tapKey('u'); // dev unlock chip
      else if(p.y>=146&&p.y<=222){ // the two role cards
        if(p.x>=40&&p.x<=248)tapKey('1');
        else if(p.x>=264&&p.x<=472)tapKey('2');
      }else tapKey('enter'); // tap elsewhere = clock in with the selected role
    }else if(scene==='ready'){e.preventDefault();tapKey(' ');} // tap anywhere to start
    else if(scene==='end'){e.preventDefault();tapKey('enter');} // tap anywhere to continue
    else{ // play scene: buttons own their taps - every other tap walks the cook or works the station
      e.preventDefault();
      touchHeld(e);
      for(var ci=0;ci<e.changedTouches.length;ci++){var pp=tpos(e.changedTouches[ci]);if(!hitBtn(pp))playTap(pp);}
    }
  },{passive:false});
  cv.addEventListener('touchmove',touchHeld,{passive:false});
  cv.addEventListener('touchend',touchEndHeld,{passive:false});
  cv.addEventListener('touchcancel',touchEndHeld,{passive:false});
}

// ---- pointer taps: click or tap the world to walk there and work it (mouse + touch, one path) ----
var walkTarget=null,walkThen=null,walkFace=null,walkStuck=0;
function pointerGamePos(cx,cy){var r=cv.getBoundingClientRect();return {x:(cx-r.left)/r.width*512,y:(cy-r.top)/r.height*352};}
function walkableTile(txx,tyy){return tile(txx,tyy)==='.';}
function faceToward(fx,fy){var adx=Math.abs(fx-P.x),ady=Math.abs(fy-P.y);P.dir=adx>ady?(fx<P.x?'left':'right'):(fy<P.y?'up':'down');}
var overlayTap=false; // a tap inside a station overlay can be HELD (clog/load/stir need press-and-hold)
function touchEndHeld(e){ // last finger up: also drop any held overlay tap
  touchHeld(e);
  if(e.touches.length===0&&overlayTap){releaseKey(' ');overlayTap=false;}
}
function playTap(p){
  if(paused){paused=false;return;} // any tap wakes a paused shift
  if(overlay){pressKey(' ');overlayTap=true;return;} // station overlays: tap-and-HOLD anywhere = the primary action (scrub/load/unclog)
  var txx=Math.floor(p.x/16),tyy=Math.floor((p.y-MAP_Y)/16);
  if(tyy<0||tyy>=MAP.length)return;
  var best=null,bd=1e9;
  for(var i=0;i<NPCS.length;i++){var n=NPCS[i];if(n.away||(n.ghost&&n.y<96))continue;
    var d2=(p.x-n.x)*(p.x-n.x)+(p.y-n.y)*(p.y-n.y);if(d2<bd){bd=d2;best=n;}}
  if(best&&bd<14*14){ // tapped a person: walk up and face them (interact = talk)
    walkTarget={x:best.x,y:best.y,thr:14};walkThen='interact';walkFace={x:best.x,y:best.y};walkStuck=0;return;
  }
  if(!walkableTile(txx,tyy)){ // tapped a station/counter: stand in FRONT of it (the hallway tile below), face it, work it
    var dirs=[[0,1],[-1,1],[1,1],[0,-1],[-1,0],[1,0],[0,2],[2,0],[0,-2],[-2,0]],pick=null;
    for(var dj=0;dj<dirs.length&&!pick;dj++){var ax=txx+dirs[dj][0],ay=tyy+dirs[dj][1];
      if(walkableTile(ax,ay))pick={x:ax*16+8,y:MAP_Y+ay*16+8};}
    if(!pick)return;
    if(!pick)return;
    walkTarget={x:pick.x,y:pick.y,thr:6};walkThen='interact';walkFace={x:txx*16+8,y:MAP_Y+tyy*16+8};walkStuck=0;return; // snap tight: land centered in front of the station
  }
  walkTarget={x:txx*16+8,y:MAP_Y+tyy*16+8,thr:14};walkThen=null;walkFace=null;walkStuck=0; // free walk to the tapped floor
}
if(cv.addEventListener&&!TOUCH){ // desktop mouse: click the menu cards, click the world to walk and work
  cv.addEventListener('mousedown',function(e){
    var p=pointerGamePos(e.clientX,e.clientY);
    if(scene==='menu'){
      if(p.x>=402&&p.x<=508&&p.y>=126&&p.y<=142)tapKey('u'); // dev unlock chip
      else if(p.y>=146&&p.y<=222){if(p.x>=40&&p.x<=248)tapKey('1');else if(p.x>=264&&p.x<=472)tapKey('2');}
      else tapKey('enter');
    }else if(scene==='ready')tapKey(' ');
    else if(scene==='end')tapKey('enter');
    else playTap(p);
  });
  cv.addEventListener('mouseup',function(){if(overlayTap){releaseKey(' ');overlayTap=false;}}); // desktop hold: click-and-hold in overlays
  cv.addEventListener('mouseleave',function(){if(overlayTap){releaseKey(' ');overlayTap=false;}});
  cv.addEventListener('contextmenu',function(e){ // RIGHT CLICK = back out of the station overlay
    e.preventDefault();
    if(overlayTap){releaseKey(' ');overlayTap=false;}
    if(scene==='play'&&overlay){overlay=null;sfxTick();}
  });
}

// ---- audio ----
var AC=null;
function beep(f,d,ty){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=ty||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.08));
  o.start();o.stop(AC.currentTime+(d||0.08));
}catch(err){}}
function sfxGood(){beep(660,0.07);beep(880,0.09);}
function sfxBad(){beep(160,0.18,'sawtooth');}
function sfxTick(){beep(520,0.04);}

function spr(s,x,y,sc){
  sc=sc||1;
  for(var rr=0;rr<s.length;rr++){var row=s[rr];
    for(var cc=0;cc<row.length;cc++){var ch=row[cc];
      if(ch!=='.'){ctx.fillStyle=PAL[ch]||'#fff';ctx.fillRect(x+cc*sc,y+rr*sc,sc,sc);}
    }
  }
}

  return {name:name,sprite:sprite,lines:lines,path:pts,wp:0,pause:0,x:pts[0].x,y:pts[0].y,dir:'down',step:0};

function updateNPCs(dt){
  for(var i=0;i<NPCS.length;i++){
    var n=NPCS[i];
    if(n.path.length<2)continue; // static (AKM)
    // the pit NPC is a perfect coworker: sees a filling tub and changes it himself
    if(n.duty==='pit'&&role==='helper'&&scene==='play'){
      if(!n.task&&tub>=4)n.task={phase:'toTub',x:5*16+8,y:MAP_Y+4*16+8}; // stand in the hallway in front of the tub
      if(n.task){
        if(n.task.phase==='changing'){
          n.taskT-=dt;n.step+=dt;
          if(n.taskT<=0){tub=0;tubAlert=false;toast('Dishwasher: Tub changed. Pit stays moving.',C.gry);beep(500,0.05);
            n.task={phase:'toPit',x:3*16+8,y:MAP_Y+6*16+8};}
          continue;
        }
        var tx=n.task.x-n.x,ty=n.task.y-n.y,td=Math.sqrt(tx*tx+ty*ty);
        if(td<3){
          if(n.task.phase==='toTub'){n.task={phase:'changing'};n.taskT=1.2;n.dir='up';continue;}
          n.task=null;n.wp=0;n.pause=0.5;continue;
        }
        var tsp=32*dt;
        n.x+=tx/td*tsp;n.y+=ty/td*tsp;
        if(Math.abs(tx)>Math.abs(ty)){n.dir=tx<0?'left':'right';}
        else{n.dir=ty<0?'up':'down';}
        n.step+=dt;
        continue;
      }
    }
    if(n.pause>0){n.pause-=dt;n.step+=dt;continue;}
    var t=n.path[n.wp];
    var dx=t.x-n.x,dy=t.y-n.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<3){n.wp=(n.wp+1)%n.path.length;n.pause=2+Math.random()*1.5;continue;}
    var sp=32*dt;
    n.x+=dx/d*sp;n.y+=dy/d*sp;
    if(dx<0)n.dir='left';else if(dx>0)n.dir='right';
    n.step+=dt;
  }
}

  }
  // rice: stir in intervals - the bar fills slowly, then a grace window before it ruins
  for(i=0;i<3;i++){var p=H.pots[i];
    if(p.cooking>0||p.grace>0){
      p.cooking=Math.max(0,p.cooking-dt);
      if(p.grace>0){
        p.grace-=dt;
        if(p.grace<=0){p.cooking=0;p.stir=0;p.grace=0;p.v=0;score-=15;addMistake(1,p.n+' POT RUINED! NOT STIRRED! -15');sfxBad();continue;}
      }else{
        p.stir+=dt/8;
        if(p.stir>=1){p.stir=1;p.grace=4;beep(240,0.15,'sawtooth');toast('STIR THE '+p.n+' POT NOW! (S)',C.red);}
      }
      // pot finishes only when cooked AND settled (no pending stir window)
      if(p.cooking<=0&&p.grace<=0&&p.stir<1){p.v=10;p.cooking=0;p.stir=0;score+=10;toast(p.n+' POT READY +10',C.grn);sfxGood();}
    }
  }
  // orders: the count is what you cook against - platters plus dine-in and take-out
  H.orderT-=dt;
  if(H.orderT<=0&&H.orders.length<2){H.orderT=pace(14)+Math.random()*pace(10);newOrder();}
  for(i=H.orders.length-1;i>=0;i--){var od=H.orders[i];
    od.timer-=dt;
    if(od.timer<=0){
      H.orders.splice(i,1);
      var haveB=H.warmer>=od.birds,haveR=H.warmRibs>=od.ribs;
      if(haveB&&haveR){ // full platter goes out
        H.warmer-=od.birds;H.warmRibs-=od.ribs;score+=15;
        toast('ORDER OUT: '+od.birds+' BIRDS'+(od.ribs?' + '+od.ribs+' RIBS':'')+' +15',C.grn);sfxGood();
      }else if(haveB||haveR){ // it went out short - the chop plate is wrong
        if(haveB)H.warmer-=od.birds;else H.warmRibs-=od.ribs;
        score-=10;addMistake(1,'ORDER WRONG: '+(haveB?od.ribs+' RIBS':od.birds+' BIRDS')+' MISSING! -10');sfxBad();
      }else{score-=15;toast('ORDER MISSED: NOTHING ON THE WARMER -15',C.red);sfxBad();}
    }
  }
  // the rail pulls all shift long - rice runs down, birds and ribs leave the warmer
  H.demandT-=dt;
  if(H.demandT<=0){
    H.demandT=pace(10)+Math.random()*pace(8);
    var rr2=Math.random();
    if(H.warmRibs>0&&rr2<0.25){H.warmRibs--;toast('The rail pulled a rib off the rib side.',C.gry);}
    else if(H.warmer>=3&&rr2<0.6){H.warmer-=3;toast('The rail pulled 3 birds off the warmer.',C.gry);}
    else{
      var rp=H.pots[Math.floor(Math.random()*3)];
      if(rp.v>0&&!rp.cooking){rp.v=Math.max(0,rp.v-2);toast('The rail pulled 2 '+rp.n+' rice.',C.gry);}
    }
  }
  // rotisserie: skewers cook, then sit READY on the skewer - pull them (S) or they burn
  for(i=0;i<H.skewers.length;i++){var k=H.skewers[i];
    if(k.has&&!k.ready){k.t-=dt;
      if(k.t<=0){k.ready=true;k.grace=8;k.warn=false;beep(760,0.08);toast('SKEWER READY - PULL IT (S AT THE ROTIS) BEFORE IT BURNS!',C.grn);}}
    else if(k.has&&k.ready){
      k.grace-=dt;
      if(k.grace<=4&&!k.warn){k.warn=true;toast('BIRDS DRYING ON THE SKEWER - PULL THEM NOW!',C.red);beep(220,0.2,'sawtooth');}
      if(k.grace<=0){k.has=false;k.ready=false;k.grace=0;score-=40;addMistake(3,'3 BIRDS BURNT ON THE SKEWER! -40');sfxBad();}
    }}
  // the cook's call system: chicken drops and rice plates
  H.callT-=dt;
  if(H.callT<=0&&H.calls.length<2){H.callT=pace(10)+Math.random()*pace(7);newCall();}
  for(i=H.calls.length-1;i>=0;i--){var c=H.calls[i];
    c.timer-=dt;
    if(c.timer<=0){H.calls.splice(i,1);score-=25;toast('MISSED: '+c.label+' -25',C.red);sfxBad();}}
}
function callProgress(type,potIdx){ // count action progress toward an active call
  var H=HS;
  for(var i=0;i<H.calls.length;i++){var c=H.calls[i];
    if(c.type===type&&(type!=='RICE'||c.pot===potIdx)){
      c.done++;
      if(c.done>=c.need){H.calls.splice(i,1);score+=20;toast('CALLOUT DONE +20',C.grn);sfxGood();}
      else toast(c.label+' ('+c.done+'/'+c.need+')',C.gold);
      return true;
    }
  }
  return false;
}

      var loaded=false;
      for(var i2=0;i2<H3.skewers.length;i2++){var sk=H3.skewers[i2];
        if(!sk.has){sk.has=true;sk.t=14;loaded=true;break;}}
      if(loaded){sfxTick();
        if(!callProgress('DROP'))toast('SKEWER LOADED',C.wht);}
      else toast('ROTIS IS FULL - BIRDS STILL COOKING',C.gry);
    }
    if(just['enter']){overlay=null;}
    return;
  }
  if(o.phase==='wash'){
    if(o.clogged&&!o.clog&&o.scrub>=3){o.clog=true;o.clogT=3.5;sfxBad();}
    if(o.clog){
      o.clogT-=dt;
      if(down['d']||down[' ']){ // press and HOLD: the clog fights back, it takes steady work
        o.clogHold+=dt;
        if(o.clogHold>=1.2){o.clog=false;o.clogged=false;o.clogHold=0;toast('DRAIN CLEARED!',C.grn);sfxGood();}
      }else o.clogHold=Math.max(0,o.clogHold-dt*2); // let go and your progress slides back
      if(o.clogT<=0){o.clog=false;o.clogHold=0;o.scrub=Math.max(0,o.scrub-5);toast('DRAIN BACKED UP!',C.red);sfxBad();}
    }
    if(just[' ']&&!o.clog){o.scrub++;sfxTick();
      if(o.scrub>=o.need){o.phase='rinse';beep(880,0.06);}}
  }else if(o.phase==='rinse'){
    if(just['r']||just[' ']){o.phase='sanitize';o.sanT=0;sfxTick();}
  }else if(o.phase==='sanitize'){
    o.sanT+=dt;
    if(just['s']||just[' ']){
      if(o.sanT>=1.5){o.phase='dry';o.dryN=0;sfxGood();}
      else{score-=5;toast('NOT SANITIZED - RE-DIP! -5',C.red);sfxBad();o.sanT=0;}
    }
  }else if(o.phase==='dry'){
    if(just[' ']){o.dryN++;sfxTick();
      if(o.dryN>=2){o.phase='putaway';beep(980,0.08);}}
  }else if(o.phase==='putaway'){
    if(just['enter']||just[' ']){
      dishes++;score+=o.grease?50:25;sfxGood();
      sinceDish=0;behindWarn=false;
      trash=Math.min(TRASH_CAP+2,trash+1);
      overlay=null;
      if(dishes>=DISH_GOAL)endShift(true);
    }
  }
}

// ---- interactions ----
function facingTile(){
  var dx=P.dir==='left'?-1:P.dir==='right'?1:0;
  var dy=P.dir==='up'?-1:P.dir==='down'?1:0;
  return tile(Math.floor((P.x+dx*12)/16),Math.floor((P.y-MAP_Y+dy*12)/16));
}
function interact(){
  var dx=P.dir==='left'?-12:P.dir==='right'?12:0;
  var dy=P.dir==='up'?-12:P.dir==='down'?12:0;
  var fx=P.x+dx,fy=P.y+dy;
  for(var i=0;i<NPCS.length;i++){
    var n=NPCS[i];
    if(n.away)continue; // AKM is out for a smoke - no talk
    if(n.ghost&&n.y<96)continue; // AKM works behind the line - he never intercepts your station work
    if(Math.abs(fx-n.x)<12&&Math.abs(fy-n.y)<12){
      say(n.name+': '+(n.lines.length?n.lines[(typeof n.li==='undefined'?0:n.li)%n.lines.length]:'...'),5);
      n.li=(typeof n.li==='undefined'?0:n.li)+1;
      return;
    }
  }
  var ch=facingTile();
  if(carrying){
    if(ch==='b'){carrying=false;score+=25;trashWarn=0;trashAlert=false;trashFullT=0;sfxGood();toast('TRASH DUMPED +25! Take a breath.',C.grn);}
    else toast('HANDS FULL OF TRASH! Take it out the BACK DOOR!',C.org);
    return;
  }
  if(ch==='x'){
    if(role==='helper'){say('The trash is pit work tonight. The dishwasher has it.',3.5);return;}
    if(trash>=2){carrying=true;trash-=2;toast('Trash bag lifted. Slow walk to the back door.',C.org);}
    else say('Not worth a trip yet. Let it fill.',3);
    return;
  }
  if(ch==='d'){
    if(role==='dish')openDish();
    else say('Not your pit tonight. The dishwasher has it. Stay on the hot side.',3.5);
    return;
  }
  if(ch==='t'){
    if(role==='helper'){say('Tub runs are pit work. The dishwasher handles it - watch him go.',3.5);return;}
    if(tub>=3){score+=15;tub=0;tubAlert=false;
      if(role==='dish')trash=Math.min(TRASH_CAP+2,trash+1);
      toast('TUB CHANGED +15',C.grn);sfxGood();}
    else say('Not full enough to change yet. Let the hot side work.',3);
    return;
  }
  if(role==='helper'&&foodCarry&&ch==='w'){ // carried meat lands at the WARMER - it ALWAYS takes ribs, hands are never stuck
    var Hw=HS;
    if(foodCarry.type==='RIBS'){
      Hw.warmRibs+=foodCarry.n;score+=8*foodCarry.n;sfxGood();
      toast(foodCarry.n+' RIB'+(foodCarry.n>1?'S':'')+' TO THE RIB SIDE +'+(8*foodCarry.n),C.grn);
    }else{
      Hw.warmer+=foodCarry.n;score+=3*foodCarry.n;sfxGood();
      toast(foodCarry.n+' BIRDS TO THE WARMER +'+(3*foodCarry.n),C.grn);
    }
    foodCarry=null;
    return;
  }
  if(role==='helper'&&foodCarry&&(ch==='g'||ch==='i'||ch==='r')){ // hands full: no station work until you drop the meat
    toast('HANDS FULL OF '+foodCarry.type+' - DROP THEM AT THE WARMER FIRST!',C.org);
    return;
  }
  if(role==='helper'&&ch==='g'){overlay={kind:'grill'};if(HS.train&&!HS.tutSeen.g){HS.tutSeen.g=1;say('AKM: SPACE flips the LOWEST bar - two flips = cooked. S pulls cooked ribs.',7);}return;}
  if(role==='helper'&&ch==='i'){overlay={kind:'rice'};if(HS.train&&!HS.tutSeen.i){HS.tutSeen.i=1;say('AKM: N starts a pot, S stirs a full bar, SPACE scoops the pot the cook CALLED.',7);}return;}
  if(role==='helper'&&ch==='r'){overlay={kind:'rotis'};if(HS.train&&!HS.tutSeen.r){HS.tutSeen.r=1;say('AKM: SPACE loads a skewer. S pulls READY birds into your hands - run them to the warmer.',7);}return;}
  if(role==='helper'&&ch==='w'){overlay={kind:'warmer'};if(HS.train&&!HS.tutSeen.w){HS.tutSeen.w=1;say('AKM: SPACE answers the cook\'s call. R grabs ribs for a chop run.',7);}return;}
  if(role==='helper'&&ch==='h'&&foodCarry){ // deliver a chop run: right item = call progress, wrong item = mistake
    var H4=HS,cc2=null;
    for(var dj=0;dj<H4.calls.length;dj++)if(H4.calls[dj].type==='HAUL'&&H4.calls[dj].item===foodCarry.type)cc2=H4.calls[dj];
    if(!cc2){score-=5;addMistake(1,'WRONG RUN - THE COOK DID NOT ASK FOR '+foodCarry.type+' -5');foodCarry=null;}
    else{
      cc2.done+=foodCarry.n;foodCarry=null;
      if(cc2.done>=cc2.need){
        for(var dj2=0;dj2<H4.calls.length;dj2++)if(H4.calls[dj2]===cc2){H4.calls.splice(dj2,1);break;}
        score+=20;toast('CALLOUT DONE +20 - THE CHOP IS HAPPY',C.grn);sfxGood();
      }else toast(cc2.label+' ('+cc2.done+'/'+cc2.need+')',C.gold);
    }
    return;
  }
  if(STATION_INFO[ch]&&STATION_INFO[ch].line)say(STATION_INFO[ch].name+': '+STATION_INFO[ch].line,6);
  else if(ch==='#')say('Steel counters. The walk-in hums.',3);
}

// ---- movement + collisions (NPCs are solid) ----
function solidAt(px,py){
  var tx=Math.floor(px/16),ty=Math.floor((py-MAP_Y)/16);
  if(ty<0)return true;
  return solid(tile(tx,ty));
}
function slideMove(dx,dy){ // blocked by a body? slip around them instead of waiting for them to move
  if(tryMove(P.x+dx,P.y+dy))return true;
  if(dx&&tryMove(P.x+dx,P.y))return true; // keep the push on one axis, slip along the other
  if(dy&&tryMove(P.x,P.y+dy))return true;
  for(var i=0;i<NPCS.length;i++){var n=NPCS[i];if(n.ghost||n.away)continue;
    if(Math.abs(P.x+dx-n.x)<14&&Math.abs(P.y+dy-n.y)<14){ // a person blocks the path: sidestep past them
      if(tryMove(P.x+dx+14,P.y+dy)||tryMove(P.x+dx-14,P.y+dy))return true;
      return false;
    }}
  return false;
}
function tryMove(nx,ny){
  var ok=true;
  if(solidAt(nx-5,ny-5)||solidAt(nx+5,ny-5)||solidAt(nx-5,ny+5)||solidAt(nx+5,ny+5))ok=false;
  for(var i=0;i<NPCS.length;i++){
    var n=NPCS[i];
    if(n.ghost)continue; // the AKM is a floater - you brush straight past him
    if(Math.abs(nx-n.x)<13&&Math.abs(ny-n.y)<13)ok=false;
  }
  if(ok){P.x=nx;P.y=ny;}
  return ok;
}
function addMiss(reason){ // dish strikes add up: too many and the shift is over
  if(mode==='train'){toast(reason+' - TRAINING: forgiven. Watch, learn, breathe.',C.gry);return;} // first-day training: no strikes
  miss++;
  if(miss>=MISS_MAX){
    toast(reason+' - THE PIT DROWNED. GO HOME.',C.red);sfxBad();
    endShift(false,true);END.miss=miss;
  }else if(miss===MISS_MAX-1){
    toast(reason+' - AKM: One more and your shift is DONE!',C.red);sfxBad();
  }else toast(reason,C.red);
}
function updatePlay(dt){
  if(just['q']){quitShift();return;} // bail out from anywhere in the shift, even mid-overlay
  if(overlay){
    if(role==='helper'){updateHelperSim(dt);timeLeft-=dt;if(timeLeft<=0)endShift(false);}
    updateOverlay(dt);return;
  }
  timeLeft-=dt;
  updateNPCs(dt);
  dumpT-=dt;
  if(dumpT<=0){
    dumpT=pace(6)+Math.random()*pace(6);
    var n2=1+Math.floor(Math.random()*2);
    tub+=n2;toast('HOT SIDE DUMPED A TUB! +'+n2,C.org);beep(240,0.12,'sawtooth');
    if(role==='dish'&&Math.random()<0.5){trash=Math.min(TRASH_CAP+2,trash+1);toast('...and scraped a plate. TRASH +1',C.gry);}
  }
  if(tub>=TUB_CAP&&!tubAlert){tubAlert=true;sfxBad();toast(role==='dish'?'TUB FULL! CHANGE IT AT THE CHOP!':'The tub is filling - the dishwasher sees it.',role==='dish'?C.red:C.gry);}
  if(role==='dish'&&tub>TUB_CAP+2){score-=10;sfxBad();tub=TUB_CAP-3;tubAlert=false;addMiss('MISSED TUB CHANGE! -10');}
  // trash duty (dishwasher's shift only - the pit NPC covers it when you are on the hot side): grace, then the score bleeds
  if(role==='dish'){
    // the AKM keeps an eye on the pit: instant tub change / trash run when things get critical
    akmHelpT-=dt;
    if(akmHelpT<=0){
      akmHelpT=slow(9)+Math.random()*slow(7);
      if(tub>=TUB_CAP+1){tub=0;tubAlert=false;toast('AKM: Tub changed - I got it. Stay on your dishes.',C.grn);beep(520,0.05);}
      else if(trashAlert&&trashFullT>=10){trash=0;carrying=false;trashAlert=false;trashWarn=0;trashFullT=0;toast('AKM: Ran the trash out - handled. Back to the pit.',C.grn);beep(520,0.05);}
    }
    if(trash>=TRASH_CAP&&!trashAlert){trashAlert=true;trashWarn=12;sfxBad();toast('TRASH FULL! Haul it out the back door!',C.red);}
    if(trashAlert&&trash>=TRASH_CAP&&!carrying){
      if(trashWarn>0)trashWarn-=dt;
      else{score-=1*dt;trashFullT+=dt;
        if(trashFullT>=25){trashFullT=0;addMiss('MISSED TRASH RUN!');}}
    }
    // the pit must keep moving: rack too slowly and it counts against you
    sinceDish+=dt;
    if(sinceDish>32&&!behindWarn){behindWarn=true;toast('AKM: The pit is falling behind - RACK SOMETHING!',C.org);beep(300,0.15,'sawtooth');}
    if(sinceDish>45){sinceDish=25;behindWarn=false;addMiss('TOO SLOW - THE PIT IS BACKING UP!');}
  }
  var sp=(carrying?42:75)*dt;
  if(down['arrowleft']||down['a']){P.dir='left';slideMove(-sp,0);walkTarget=null;}
  else if(down['arrowright']||down['d']){P.dir='right';slideMove(sp,0);walkTarget=null;}
  else if(down['arrowup']||down['w']){P.dir='up';slideMove(0,-sp);walkTarget=null;}
  else if(down['arrowdown']||down['s']){P.dir='down';slideMove(0,sp);walkTarget=null;}
  else if(walkTarget){ // pointer walking: step toward the tapped tile; keys always override
    var wdx=walkTarget.x-P.x,wdy=walkTarget.y-P.y,wd=Math.sqrt(wdx*wdx+wdy*wdy);
    var wthr=walkTarget.thr||14,moved=false;
    if(wd>wthr){ // stations want a tight center; people you tapped need room to be talked to
      if(Math.abs(wdx)>Math.abs(wdy)){if(tryMove(P.x+sp*Math.sign(wdx),P.y))moved=true;else if(tryMove(P.x,P.y+sp*Math.sign(wdy)))moved=true;}
      else{if(tryMove(P.x,P.y+sp*Math.sign(wdy)))moved=true;else if(tryMove(P.x+sp*Math.sign(wdx),P.y))moved=true;}
    }
    if(wd<=wthr||!moved)walkStuck+=dt;else walkStuck=0;
    if(wd<=wthr||walkStuck>0.45){ // arrived (or wedged): face the goal and work it
      walkStuck=0;
      if(walkFace)faceToward(walkFace.x,walkFace.y);
      var work=walkThen;walkTarget=null;walkThen=null;walkFace=null;
      if(work==='interact')interact();
    }
  }
  if(just[' '])interact();
  if(role==='helper')updateHelperSim(dt);
  if(timeLeft<=0)endShift(false);
}

function quitShift(){ // abandon the shift: straight to the menu, no end screen, nothing counted

function endShift(early,fired){
  scene='end';  END={dishes:dishes,early:early,fired:!!fired,score:Math.floor(score),train:(HS&&HS.train)||mode==='train',promoted:false};
  if(!END.train&&role==='dish'){career.dishShifts=(career.dishShifts||0)+1;saveCareer();} // the rush dial ticks: every real shift survived cranks the pace
  // career progression: clean (non-training, non-fired) dish shift that racks the goal AND scores 300+ counts toward the promotion
  if(!END.fired&&!END.train&&role==='dish'&&dishes>=DISH_GOAL&&END.score>=300){
    career.wins++;saveCareer();
    if(career.rank==='dish'&&career.wins>=CAREER_WINS){career.rank='helper';saveCareer();END.promoted=true;}
  }
}

function updateMenu(){

function startShift(){

  else if(role==='helper'&&!career.trainedHelper){mode='train';career.trainedHelper=true;saveCareer();}
  else mode='shift'; // trained already: this is a real shift (menu selection also sets this)
  NIGHT=(role==='helper'?(career.helperShifts||0):(career.dishShifts||0))+1; // the rush dial: every survived shift, the kitchen runs hotter
  if(mode==='train')NIGHT=1;
  setupNPCs();
  P={x:14*16+8,y:MAP_Y+4*16+8,dir:'down'};
  timeLeft=120;score=0;dishes=0;tub=2;dumpT=9;tubAlert=false;
  trash=1;carrying=false;foodCarry=null;trashWarn=0;trashAlert=false;toastQ.length=0;
  miss=0;sinceDish=0;trashFullT=0;behindWarn=false;akmHelpT=9;
  overlay=null;scene='ready'; // breather screen first - nothing simulates until the player opts in
  if(role==='helper'){
    if(mode==='shift'){career.helperShifts=(career.helperShifts||0)+1;saveCareer();} // shift 1 after training = AKM rides the grill with you
    initHelper();

      {at:62,m:'AKM: WARMER - SPACE answers the cook\'s call. R grabs ribs for a chop run - deliver at the CHOP.'},
      {at:76,m:'AKM: Mistakes are forgiven today. Watch my hands - flip, stir, pull. Real shift next time.'}];
    else TUT=[];
  }else TUT=[];
}

function updateEnd(){ // FNAF flow: the next shift starts NOW - the title screen is only a Q away

    if(END.fired){scene='menu';return;} // sent home: pick your next move yourself

// ---- pause: the shift freezes when the tab is hidden or the window loses focus ----
var paused=false;
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',function(){if(document.hidden)paused=true;});
if(window.addEventListener){window.addEventListener('blur',function(){paused=true;});window.addEventListener('focus',function(){paused=false;});}

// ---- main loop ----
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(paused&&scene==='play'){ // nothing simulates, nothing burns, the clock holds
    drawPlay(0);
    R(150,140,212,48,C.panel);R(150,140,212,2,C.gold);R(150,186,212,2,C.gold);
    T('PAUSED',216,146,C.gold,14);
    T(TOUCH?'TAP ANY BUTTON TO RESUME':'PRESS ANY KEY TO RESUME',150,168,C.wht,9);
    if(TOUCH)drawTouchUI();
    for(var pk in just)just[pk]=false;
    requestAnimationFrame(loop);
    return;
  }
  if(scene==='menu'){updateMenu();drawMenu();}
  else if(scene==='ready'){updateReady();drawReady();}
  else if(scene==='play'){updatePlay(dt);if(scene==='play')drawPlay(dt);}
  else if(scene==='end'){updateEnd();drawEnd();}
  if(TOUCH&&scene==='play')drawTouchUI(); // virtual keys over the world on touch devices
  for(var k in just)just[k]=false;
  requestAnimationFrame(loop);
}
setupNPCs();
requestAnimationFrame(loop);
